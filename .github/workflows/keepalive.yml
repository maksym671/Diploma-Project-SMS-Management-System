name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: curl -sS -o /dev/null -w "%{http_code}\n" --max-time 45 https://diploma-project-sms-management-system.onrender.com/login/ || true
