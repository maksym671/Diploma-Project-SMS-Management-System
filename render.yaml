# Render Blueprint: describes the whole deployment as code.
# Create the service from this file via Render Dashboard -> New -> Blueprint.
services:
  - type: web
    name: diploma-project-sms-management-system
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn sms_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      # Generated once by Render and kept for the life of the service.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # RENDER_EXTERNAL_HOSTNAME is injected automatically and appended to
      # ALLOWED_HOSTS in settings.py, so only extra custom domains go here.
      - key: ALLOWED_HOSTS
        sync: false

      # Required once a custom domain is attached, e.g.
      # https://sms.example.me,https://sms-student-management.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # Postgres connection string (Neon free tier — it does not expire,
      # unlike Render's own free database).
      - key: DATABASE_URL
        sync: false

      # Replaces the published demo password on the admin account. Set it in
      # the dashboard so it never reaches the repository.
      - key: DJANGO_ADMIN_PASSWORD
        sync: false

      # ---------------------------------------------------------------
      # Password-reset email.
      #
      # Render's free plan firewalls outbound SMTP (ports 25/465/587), so the
      # stock "smtp" backend hangs on connect until the worker times out and
      # the reset page returns a 500. "brevo" sends the identical message over
      # plain HTTPS (port 443, not filtered) via core.mail.BrevoAPIBackend, so
      # it is the backend to use on this plan.
      #
      # Set BREVO_API_KEY and DEFAULT_FROM_EMAIL in the Render dashboard
      # (Environment tab) so the secret never reaches the repository. With no
      # key the reset page still responds normally (a warning is logged and no
      # mail is sent) instead of erroring.
      #
      # `manage.py check --deploy` warns (mail.W005) if the key is missing.
      # ---------------------------------------------------------------
      - key: EMAIL_BACKEND
        value: brevo

      # Create at brevo.com -> SMTP & API -> API keys (free tier). Secret,
      # so it stays out of the repo.
      - key: BREVO_API_KEY
        sync: false

      # Must be an address verified on the Brevo account (Senders & IPs),
      # otherwise Brevo rejects the message.
      # Example: Student Management System <your.verified@address.com>
      - key: DEFAULT_FROM_EMAIL
        sync: false
