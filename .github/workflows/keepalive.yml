name: Keep Render Awake

on:
  schedule:
    # Not more often than this. GitHub bills a private repository in whole
    # minutes per job, and the free allowance is 2000 a month: every five
    # minutes would cost 8640 and take CI down with it when the allowance ran
    # out. What actually keeps both the service and its database warm is
    # Render polling /healthz/, which runs a statement; this is the backup.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live SMS
        run: |
          hit() { curl -sS -o /dev/null -w "%{http_code}\n" --max-time 45 "$1" || true; }
          # /healthz/ runs a statement, so this keeps the managed Postgres awake
          # as well as the web service; /login/ renders without touching it.
          hit "https://thesms.me/healthz/"
          hit "https://diploma-project-sms-management-system.onrender.com/healthz/"
