{% extends 'base.html' %}

{% block title %}My Profile{% endblock %}
{% block breadcrumb %}Profile{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">My Profile</h1>
        <p class="page-subtitle">Update your personal information</p>
    </div>
</div>

<div class="card" style="max-width: 560px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    {{ form.first_name }}
                </div>
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    {{ form.last_name }}
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                {{ form.email }}
            </div>

            <div class="form-group" style="padding-top: 16px; border-top: 1px solid var(--border);">
                <label class="form-label">Security</label>
                <a href="{% url 'password_reset' %}" class="btn btn-outline btn-sm">
                    <i class="bi bi-shield-lock"></i> Reset Password
                </a>
            </div>

            <div class="btn-group mt-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
