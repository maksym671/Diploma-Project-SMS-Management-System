# Render Blueprint: describes the whole deployment as code.
# Create the service from this file via Render Dashboard -> New -> Blueprint.
services:
  - type: web
    name: diploma-project-sms-management-system
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn sms_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      # Generated once by Render and kept for the life of the service.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # RENDER_EXTERNAL_HOSTNAME is injected automatically and appended to
      # ALLOWED_HOSTS in settings.py, so only extra custom domains go here.
      - key: ALLOWED_HOSTS
        sync: false

      # Required once a custom domain is attached, e.g.
      # https://sms.example.me,https://sms-student-management.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # Postgres connection string (Neon free tier — it does not expire,
      # unlike Render's own free database).
      - key: DATABASE_URL
        sync: false

      # Replaces the published demo password on the admin account. Set it in
      # the dashboard so it never reaches the repository.
      - key: DJANGO_ADMIN_PASSWORD
        sync: false

      # ---------------------------------------------------------------
      # Password-reset email.
      #
      # "console" only writes the message to the Render log, so nobody
      # actually receives a reset link. "smtp" delivers for real and needs
      # the four values below; set the secret ones in the Render dashboard
      # (Environment tab) so they never reach the repository.
      #
      # `manage.py check --deploy` fails loudly if this is half-configured.
      # ---------------------------------------------------------------
      - key: EMAIL_BACKEND
        value: smtp

      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"

      # The mailbox that sends the message — for Gmail this is the account
      # itself, and EMAIL_HOST_PASSWORD must be a 16-character App Password
      # (Google account -> Security -> 2-Step Verification -> App passwords),
      # never the normal account password.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

      # Must be the address that owns the SMTP account, otherwise providers
      # drop the message or file it as spam.
      # Example: Student Management System <your.account@gmail.com>
      - key: DEFAULT_FROM_EMAIL
        sync: false
