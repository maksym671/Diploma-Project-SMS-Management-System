<!DOCTYPE html>
<html lang="en">
<head>
    {# Rendered with an empty context: no request, no user, no context processors. #}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong — SMS</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f6f7fb; color: #1c2333;
        }
        .card {
            max-width: 520px; width: 100%; text-align: center; padding: 40px 32px;
            background: #fff; border: 1px solid #e5e8f0; border-radius: 12px;
        }
        .code { font-size: 56px; font-weight: 700; line-height: 1; color: #3b5bfd; }
        h1 { font-size: 22px; margin: 12px 0 8px; }
        p { margin: 0; color: #626c85; font-size: 14px; line-height: 1.6; }
        a {
            display: inline-block; margin-top: 24px; padding: 10px 18px;
            background: #3b5bfd; color: #fff; text-decoration: none;
            border-radius: 8px; font-size: 14px; font-weight: 600;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f1218; color: #e8ebf2; }
            .card { background: #161a23; border-color: #262c39; }
            p { color: #98a1b5; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <h1>Something went wrong</h1>
        <p>The server hit an unexpected error handling that request. It has been
           logged; please try again in a moment.</p>
        <a href="/">Back to the dashboard</a>
    </div>
</body>
</html>
