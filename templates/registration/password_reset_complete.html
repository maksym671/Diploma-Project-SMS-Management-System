{% extends 'base.html' %}

{% block content_noauth %}
<div class="login-page">
    <div class="login-card" style="text-align: center;">
        <div class="login-logo" style="background: var(--success);">
            <i class="bi bi-check-lg"></i>
        </div>
        <h2>Password Reset Complete</h2>
        <p class="subtitle">
            Your password has been set. You may go ahead and log in now.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 11px;">
            Log In
        </a>
    </div>
</div>
{% endblock %}
